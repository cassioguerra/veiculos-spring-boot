# ===== BANCO DE DADOS H2 =====
# H2 é um banco de dados que fica na memória RAM
# Vantagem: não precisa instalar nada. Desvantagem: dados somem ao reiniciar
spring.datasource.url=jdbc:h2:mem:veiculosdb
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect

# Mostra no console qual SQL está sendo executado (útil para debug)
spring.jpa.show-sql=true

# create-drop = cria as tabelas ao iniciar e apaga ao parar
spring.jpa.hibernate.ddl-auto=create-drop

# Habilita o console web do H2 (acesse em http://localhost:9090/h2-console)
spring.h2.console.enabled=true

# ===== SERVIDOR =====
# Porta 9090 evita conflito com outros programas que usam 8080
server.port=9090

# ===== GEMINI AI =====
# Chave da API do Google Gemini (gerada no Google AI Studio)
gemini.api.key=COLOQUE_SUA_CHAVE_AQUI